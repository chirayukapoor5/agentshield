name: groq-credential-preflight
on:
  workflow_dispatch:
  push:
    branches:
      - research/multilingual-injection-2026
    paths:
      - .github/workflows/groq-preflight.yml

permissions:
  contents: read

concurrency:
  group: groq-preflight-once
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YAML parser only
        run: python -m pip install 'PyYAML>=6.0.1,<7'
      - name: Check credential presence without printing it
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "GROQ_API_KEY is missing in GitHub Actions secrets."
            exit 1
          fi
          echo "GROQ_API_KEY is configured."
      - name: Run bounded 20-call Groq connectivity test
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PYTHONPATH: .
        run: |
          python scripts/groq_preflight.py --count 20 --pause 6 \
            --output data/runs/groq-preflight.json \
            --i-understand-this-makes-real-calls
      - name: Upload redacted preflight metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: groq-preflight-metadata
          path: data/runs/groq-preflight.json
          if-no-files-found: ignore
          retention-days: 7
