name: guard-security-stress-10k

on:
  push:
    branches: [research/multilingual-injection-2026]
    paths:
      - sdk/agentshield_guard/**
      - sdk/tests/**
      - sdk/pyproject.toml
      - scripts/run_guard_stress.py
      - tests/test_guard_stress.py
      - .github/workflows/guard-stress-10k.yml
  pull_request:
    branches: [main]
    paths:
      - sdk/agentshield_guard/**
      - sdk/tests/**
      - sdk/pyproject.toml
      - scripts/run_guard_stress.py
      - tests/test_guard_stress.py
      - .github/workflows/guard-stress-10k.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stress:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install local AgentShield SDK and pytest
        run: |
          python -m pip install -e ./sdk
          python -m pip install "pytest>=8,<10"
      - name: Verify stress harness invariants
        env:
          PYTHONPATH: sdk:.
        run: python -m pytest -q tests/test_guard_stress.py
      - name: Run exactly 10,000 seeded offline adversarial contract cases
        env:
          PYTHONPATH: sdk:.
        run: |
          python scripts/run_guard_stress.py --cases 10000 --seed 20261107 --output "data/runs/stress/guard-stress-python-${{ matrix.python-version }}.json"
      - name: Save auditable aggregate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guard-stress-10k-python-${{ matrix.python-version }}
          path: data/runs/stress/*.json
          if-no-files-found: warn
          retention-days: 90
