name: groq-local-tool-smoke
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Groq chat model ID; default tested model"
        required: false
        default: "openai/gpt-oss-120b"

permissions:
  contents: read

concurrency:
  group: groq-local-tool-smoke
  cancel-in-progress: false

jobs:
  tool-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install current local SDK
        run: python -m pip install ./sdk
      - name: Verify deterministic offline replay
        env:
          PYTHONPATH: sdk
        run: |
          python scripts/groq_tool_smoke.py --mode mock \
            --output data/runs/groq-tool-mock.json
      - name: Verify API secret exists without displaying its value
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "GROQ_API_KEY must be configured as a repository secret."
            exit 1
          fi
          echo "Provider credential configured."
      - name: Execute bounded live local-tool agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PYTHONPATH: sdk
        run: |
          python scripts/groq_tool_smoke.py --mode live \
            --model "${{ inputs.model || 'openai/gpt-oss-120b' }}" \
            --output data/runs/groq-tool-live.json \
            --i-understand-this-makes-real-calls
      - name: Upload redacted execution summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: groq-local-tool-smoke-redacted
          path: data/runs/groq-tool-*.json
          if-no-files-found: ignore
          retention-days: 7
