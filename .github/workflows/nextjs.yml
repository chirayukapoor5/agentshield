# AgentShield's public showcase is an independent static page, not a Next.js
# project at repository root. This is the default-branch deployment entrypoint;
# it publishes only the isolated public-demo/ directory from the research
# branch, without deploying the incomplete FastAPI/Next.js application.
name: Deploy AgentShield showcase to Pages

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/nextjs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: agentshield-showcase-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout CI-verified five-stage showcase and LangGraph quickstart
        uses: actions/checkout@v4
        with:
          # Pin to exact research commit with successful offline + Chromium CI.
          # Update only after reviewing a new passing verification run.
          ref: 70f0c072a854be03051f9b02ce7f3f2925c6423f
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate standalone showcase
        run: |
          python scripts/verify_public_demo.py
          node scripts/test_public_demo.mjs
          test -s public-demo/index.html
          grep -q 'sandbox-all-five-v3' public-demo/index.html
          grep -q 'evidence-scorecard' public-demo/index.html
          grep -q '90 / 90' public-demo/index.html
          grep -q '10,000 / 10,000' public-demo/index.html
          grep -q 'def human_approval(tool, args):' public-demo/index.html
          test -s public-demo/sandbox.js
      - name: Install real headless Chromium test environment
        run: |
          python -m pip install "playwright==1.57.0"
          python -m playwright install --with-deps chromium
      - name: Run full five-stage browser acceptance tests
        run: python scripts/test_public_demo_browser.py
      - name: Store browser acceptance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-showcase-browser-screenshots
          path: data/ui-acceptance/
          if-no-files-found: ignore
          retention-days: 14
      - name: Package static page
        run: |
          touch public-demo/.nojekyll
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public-demo

  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify unauthenticated public HTTPS page
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          case "$PAGE_URL" in
            https://*) ;;
            *) echo "Invalid or empty HTTPS Pages URL"; exit 1;;
          esac
          for attempt in 1 2 3 4 5 6 7 8; do
            code=$(curl --proto '=https' --max-redirs 3 -sS -L --max-time 20 -o /tmp/agentshield-showcase.html -w '%{http_code}' "$PAGE_URL" || true)
            if [ "$code" = "200" ] && grep -q 'id="demo"' /tmp/agentshield-showcase.html && grep -q 'id="feedback"' /tmp/agentshield-showcase.html && grep -q 'sandbox-all-five-v3' /tmp/agentshield-showcase.html && grep -q 'id="evidence-scorecard"' /tmp/agentshield-showcase.html && grep -q '10,000 / 10,000' /tmp/agentshield-showcase.html && grep -q '90 / 90' /tmp/agentshield-showcase.html && grep -q 'def human_approval(tool, args):' /tmp/agentshield-showcase.html; then
              js_code=$(curl --proto '=https' --max-redirs 3 -sS -L --max-time 20 -o /tmp/agentshield-sandbox.js -w '%{http_code}' "${PAGE_URL%/}/sandbox.js" || true)
              if [ "$js_code" = "200" ] && grep -q 'synthetic_browser_sandbox_v3' /tmp/agentshield-sandbox.js; then
                echo "PUBLIC_DEMO_V3_VERIFIED: $PAGE_URL HTTP $code; sandbox.js HTTP $js_code"
                exit 0
              fi
            fi
            echo "Attempt $attempt: page HTTP $code, sandbox.js HTTP ${js_code:-not_checked}; waiting for Pages propagation"
            sleep 5
          done
          echo "Pages deployment is not yet publicly reachable with the intended content"
          exit 1
      - name: Checkout the exact released source for browser acceptance
        uses: actions/checkout@v4
        with:
          ref: 70f0c072a854be03051f9b02ce7f3f2925c6423f
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Chromium for published-site acceptance
        run: |
          python -m pip install "playwright==1.57.0"
          python -m playwright install --with-deps chromium
      - name: Verify actual public HTTPS interactive stages and scorecard
        run: python scripts/test_public_demo_browser.py --live
      - name: Upload live browser acceptance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-site-browser-acceptance
          path: data/ui-acceptance/
          if-no-files-found: ignore
          retention-days: 14
