name: verify-agent-shield-showcase

on:
  push:
    branches:
      - research/multilingual-injection-2026
    paths:
      - public-demo/**
      - scripts/verify_public_demo.py
      - scripts/test_public_demo.mjs
      - scripts/test_public_demo_browser.py
      - .github/workflows/publish-showcase.yml
  pull_request:
    paths:
      - public-demo/**
      - scripts/verify_public_demo.py
      - .github/workflows/publish-showcase.yml
  workflow_dispatch:

# This research-branch workflow only validates and archives the preview.
# Actual GitHub Pages deployment runs from main in .github/workflows/nextjs.yml.

permissions:
  contents: read

concurrency:
  group: agentshield-showcase-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify static demo and JavaScript syntax
        run: python scripts/verify_public_demo.py
      - name: Smoke test all five stages with deterministic DOM
        run: node scripts/test_public_demo.mjs
      - name: Install isolated Chromium browser test
        run: |
          python -m pip install "playwright==1.57.0"
          python -m playwright install --with-deps chromium
      - name: Execute five-stage browser acceptance
        run: python scripts/test_public_demo_browser.py
      - name: Upload interactive acceptance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentshield-browser-acceptance
          path: data/ui-acceptance/
          if-no-files-found: ignore
          retention-days: 14
      - name: Prepare no-Jekyll static site
        run: |
          touch public-demo/.nojekyll
          test -s public-demo/index.html
      - name: Preserve independently verified preview
        uses: actions/upload-artifact@v4
        with:
          name: agentshield-static-showcase-preview
          path: public-demo/
          if-no-files-found: error
          retention-days: 30

