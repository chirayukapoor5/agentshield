name: agentshield-sdk-validation
on:
  push:
    branches: ["research/**"]
    paths: ["sdk/**", "scripts/export_ci_test_summary.py", ".github/workflows/sdk.yml"]
  pull_request:
    paths: ["sdk/**", "scripts/export_ci_test_summary.py", ".github/workflows/sdk.yml"]
permissions:
  contents: read
jobs:
  sdk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install SDK as one local package
        run: |
          python -m pip install ./sdk
          python -m pip install 'pytest>=8,<10' 'scikit-learn>=1.5,<2'
      - name: Install optional LangChain and LangGraph integration
        run: python -m pip install "./sdk[langgraph]"
      - name: Run all core and real-framework integration tests
        run: python -m pytest -q sdk/tests --junitxml=.ci-reports/sdk.xml
      - name: Export sanitized test summary
        if: always() && hashFiles('.ci-reports/sdk.xml') != ''
        run: python scripts/export_ci_test_summary.py --input .ci-reports/sdk.xml --output .ci-reports/run-${{ github.run_id }}-py-${{ matrix.python-version }}.json --run-id ${{ github.run_id }} --python-version ${{ matrix.python-version }}
      - name: Upload sanitized summary only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-summary-sdk-py-${{ matrix.python-version }}
          path: .ci-reports/run-*-py-${{ matrix.python-version }}.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - name: Execute synthetic demo
        run: |
          python sdk/examples/quickstart.py
          python sdk/examples/demo_stats.py
