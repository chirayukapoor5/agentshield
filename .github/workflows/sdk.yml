name: agentshield-sdk-validation
on:
  push:
    branches: ["research/**"]
    paths: ["sdk/**", ".github/workflows/sdk.yml"]
  pull_request:
    paths: ["sdk/**", ".github/workflows/sdk.yml"]
permissions:
  contents: read
jobs:
  sdk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install SDK as one local package
        run: |
          python -m pip install ./sdk
          python -m pip install pytest
      - name: Run tests
        run: python -m pytest -q sdk/tests
      - name: Execute synthetic demo
        run: |
          python sdk/examples/quickstart.py
          python sdk/examples/demo_stats.py
