name: ai-cybersecurity-validation
on:
  push:
    branches: ["research/**"]
    paths:
      - "sdk/**"
      - ".github/workflows/ai-cybersecurity.yml"
  pull_request:
    paths:
      - "sdk/**"
      - ".github/workflows/ai-cybersecurity.yml"
permissions:
  contents: read
jobs:
  monitor-and-incident-integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install SDK and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./sdk[test]" "scikit-learn>=1.3,<2"
      - name: Compile all Python sources
        run: python -m compileall -q sdk/agentshield_guard sdk/tests sdk/examples
      - name: Run monitoring, anomaly, incident and end-to-end tests
        run: |
          python -m pytest -q sdk/tests/test_monitoring.py sdk/tests/test_anomaly.py sdk/tests/test_incident_store.py sdk/tests/test_monitoring_demo.py
      - name: Run complete SDK test suite
        run: python -m pytest -q sdk/tests
      - name: Execute fictional monitoring walkthrough
        run: python sdk/examples/monitoring_demo.py
