name: publish-agent-shield-demo
on:
  workflow_dispatch:
  push:
    branches: ["research/multilingual-injection-2026"]
    paths:
      - "frontend/app/lab/**"
      - "frontend/app/page.tsx"
      - "frontend/next.config.mjs"
      - ".github/workflows/publish-demo.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: agent-shield-public-demo-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install from lockfile
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Export static public demo (no API credentials)
        working-directory: frontend
        env:
          AGENTSHIELD_PAGES_BUILD: "1"
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
      - name: Confirm static lab HTML exists
        run: test -f frontend/out/lab/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
