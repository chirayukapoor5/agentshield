[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentshield-guard"
version = "0.1.0"
description = "Small fail-closed tool execution guard for LLM-agent integrations"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[tool.setuptools.packages.find]
include = ["agentshield_guard*"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
